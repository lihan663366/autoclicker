name: Build AutoClicker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -sL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" 2>/dev/null || true
          ls "$THEOS/sdks"
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build package
        run: |
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-deb
          path: packages/*.deb
          if-no-files-found: error
